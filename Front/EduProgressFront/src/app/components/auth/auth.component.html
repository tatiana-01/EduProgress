
<div class="error " *ngIf="errorSession">
    <div class="alert alert-danger " role="alert">
        Error al iniciar sesion, verifique las credenciales.
      </div>
  </div>

<div class=" login">
    <div class="row justify-content-center">
        <div class="col-6 col-sm-5">
                  <form  [formGroup]="loginForm" (ngSubmit)="sendLogin()" >
                    <div class="form-group mb-3">
                      <label for="username" class="h5">Usuario </label>
                      <input type="username" id="username" class="form-control" name="username" formControlName="username" placeholder="Usuario">
                    </div>
                    <div class="form-group mb-3">
                      <label for="password" class="h5">Contraseña</label>
                      <input type="password" id="password" class="form-control" name="password" formControlName="password" placeholder="Contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid">Login</button>
                  </form>
        </div>
        
    </div>
  </div>
