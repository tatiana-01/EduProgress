<div class="selecRol">

    <div class="row"><h1>Selecciona el rol con el que vas a ingresar:</h1></div>
    
    <div class="row">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let rol of roles">
            <button class="btn btn-primary mb-2" (click)="onRoleSelect(rol)" >
                {{ rol  }}
              </button>
          </div>
    </div>
  </div>
